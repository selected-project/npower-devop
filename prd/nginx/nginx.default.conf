upstream django {
    server django:8000;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
}

server {
    server_name api.mynpower.ai;

    location /api/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api-2/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /openai/ {
        proxy_pass https://api.openai.com/;
        proxy_set_header Host api.openai.com;

        # Forward Authorization header from client
        proxy_pass_header Authorization;
        proxy_set_header Authorization $http_authorization;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;

        # Forward CORS Headers from OpenAI to Client
        proxy_pass_header Access-Control-Allow-Origin;
        proxy_pass_header Access-Control-Allow-Methods;
        proxy_pass_header Access-Control-Allow-Headers;
        proxy_pass_header Access-Control-Allow-Credentials;

        # Handle Preflight OPTIONS Request and respond with proper CORS headers
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin *; # Allow any origin or set a specific origin if needed
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type";
            add_header Access-Control-Allow-Credentials true;
            return 204;
        }
    }

    location /static/ {
        alias /home/app/web/staticfiles/;
    }
}

server {
    server_name portal.mynpower.ai;

    location / {
        root /usr/share/nginx/html/vue-app;
        try_files $uri $uri/ /index.html;
    }
}
