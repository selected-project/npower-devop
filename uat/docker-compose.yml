services:
  nginx:
    image: nginx:1.23
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/nginx.default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/keys:/etc/nginx/keys
      - ./wordpress:/var/www/html
      - /home/npdev1/app/frontend/www/vue-app:/usr/share/nginx/html/vue-app
      - static_volume:/home/app/web/staticfiles

    ports:
      - 80:80
      - 443:443
    depends_on:
      - django
      - php
    networks:
      - app-network

  django:
    image: ghcr.io/xlance-collective/npower-backend:latest
    container_name: django-dev
    volumes:
      - static_volume:/home/app/web/staticfiles
    depends_on:
      - redis
    expose:
      - 8000
    env_file:
      - ./.env.be
    networks:
      - app-network

  php:
    image: wordpress:6.5-fpm-alpine
    container_name: php
    ports:
      - "9000:9000"
    depends_on:
      - db
    env_file: .env.wp
    volumes:
      - ./wordpress:/var/www/html
    networks:
      - app-network

  db:
    image: mysql:8.4
    container_name: db
    ports:
      - "3306:3306"
    env_file: .env.wp
    environment:
      MYSQL_DATABASE: wordpress
    volumes:
      - ./db_data:/var/lib/mysql
    networks:
      - app-network

  redis:
    container_name: redis
    image: redis/redis-stack-server:7.2.0
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network

networks:
  app-network:

volumes:
  static_volume:
  redis_data:
