services:
  nginx:
    image: ghcr.io/xlance-collective/npower-protal:uat-latest
    container_name: vue-nginx
    restart: always
    depends_on:
      - django
      - php
      - flask-dev
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/nginx.default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/keys:/etc/nginx/keys
      - ./wordpress:/var/www/html
      - static_volume:/home/app/web/staticfiles
    networks:
      - app-network


  django:
    image: ghcr.io/xlance-collective/npower-backend:latest
    container_name: django-dev
    restart: always
    expose:
      - "8000"
    depends_on:
      - redis
    env_file:
      - ./.env.be
    volumes:
      - static_volume:/home/app/web/staticfiles
      - ./gemini-cred.json:/home/app/web/gemini-cred.json
      - ./firebase-cred.json:/home/app/web/firebase-cred.json
    networks:
      - app-network


  celery:
    image: ghcr.io/xlance-collective/npower-backend:latest
    container_name: celery
    command: celery -A configs worker -l info
    restart: always
    depends_on:
      - redis
    env_file:
      - ./.env.be
    volumes:
      - ./gemini-cred.json:/home/app/web/gemini-cred.json
      - ./firebase-cred.json:/home/app/web/firebase-cred.json
    networks:
      - app-network


  beat:
    image: ghcr.io/xlance-collective/npower-backend:latest
    container_name: beat
    command: celery -A configs beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    restart: always
    depends_on:
      - redis
    env_file:
      - ./.env.be
    volumes:
      - ./gemini-cred.json:/home/app/web/gemini-cred.json
      - ./firebase-cred.json:/home/app/web/firebase-cred.json
    networks:
      - app-network


  php:
    image: wordpress:6.5-fpm-alpine
    container_name: php
    restart: always
    depends_on:
      - db
    env_file: .env.wp
    ports:
      - "9000:9000"
    volumes:
      - ./wordpress:/var/www/html
    networks:
      - app-network


  db:
    image: mysql:latest
    container_name: db
    restart: always
    environment:
      MYSQL_DATABASE: wordpress
    env_file: .env.wp
    ports:
      - "3306:3306"
    volumes:
      - ./db_data:/var/lib/mysql
    networks:
      - app-network


  redis:
    image: redis/redis-stack-server:7.4.0-v5
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network


  flask-dev:
    image: ghcr.io/xlance-collective/flask-dev:latest
    container_name: flask-dev
    restart: always
    command: python server.py
    env_file:
      - .env.be
    depends_on:
      - chromadb
    ports:
      - "5000:5000"
    volumes:
      - static_volume:/home/app/web/staticfiles
    networks:
      - app-network


  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb
    restart: on-failure
    env_file:
      - .env.be
    ports:
      - "8000:8000"
    volumes:
      - chromadb_data:/data
    networks:
      - app-network
volumes:
  static_volume:
  redis_data:
  chromadb_data:

networks:
  app-network: