version: "3.9"

services:
  nginx:
    image: nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/nginx.default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/keys:/etc/nginx/keys
      - ./wordpress:/var/www/html
      - /home/npdev1/app/frontend/www/vue-app:/usr/share/nginx/html/vue-app
      - static_volume:/home/app/web/staticfiles

    ports:
      - 80:80
      - 443:443
    depends_on:
      - django
      - php
    networks:
      - app-network

  django:
    image: ghcr.io/xlance-collective/npower-backend:latest
    container_name: django-dev
    command: gunicorn --config ./gunicorn_conf.py configs.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - static_volume:/home/app/web/staticfiles
    depends_on:
      - redis
    expose:
      - 8000
    env_file:
      - ./.env.uat
    networks:
      - app-network

  php:
    image: wordpress:fpm-alpine
    container_name: php
    ports:
      - "9000:9000"
    depends_on:
      - db
    env_file: .env.uat
    environment:
      - WORDPRESS_DB_HOST=db:3306
      - WORDPRESS_DB_USER=$MYSQL_USER
      - WORDPRESS_DB_PASSWORD=$MYSQL_PASSWORD
      - WORDPRESS_DB_NAME=wordpress
    volumes:
      - ./wordpress:/var/www/html
    networks:
      - app-network

  db:
    image: mysql:latest
    container_name: db
    ports:
      - "3306:3306"
    env_file: .env.uat
    environment:
      MYSQL_DATABASE: wordpress
    volumes:
      - ./db_data:/var/lib/mysql
    networks:
      - app-network

  redis:
    container_name: redis
    image: redis/redis-stack-server:latest
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    networks:
      - app-network

networks:
  app-network:

volumes:
  static_volume:
  certbot-etc:
