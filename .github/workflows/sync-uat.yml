name: Deploy UAT Files to Server
on:
  push:
    tags:
      - 'uat-*'

jobs:
  deploy:
    runs-on: np-dev-op
    env:
      SSH_USERNAME: ${{ vars.SSH_USERNAME }}
      SSH_HOST: ${{ vars.SSH_HOST }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      ENV_BE: ${{ secrets.ENV_BE }}
      ENV_FE: ${{ secrets.ENV_FE }}
      ENV_WP: ${{ secrets.ENV_WP }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $SSH_HOST >> ~/.ssh/known_hosts

      - name: Create .env.be on server
        run: ssh $SSH_USERNAME@$SSH_HOST "echo '$ENV_BE' > /home/$SSH_USERNAME/app/.env.be"

      - name: Create .env.fe on server
        run: ssh $SSH_USERNAME@$SSH_HOST "echo '$ENV_FE' > /home/$SSH_USERNAME/app/.env.fe"

      - name: Create .env.wp on server
        run: ssh $SSH_USERNAME@$SSH_HOST "echo '$ENV_WP' > /home/$SSH_USERNAME/app/.env.wp"

      - name: Copy uat/ excluding nginx to app/ folder on server
        run: |
          rsync -rlptDz --exclude 'nginx/' --exclude '**/*.example.env.*' uat/ $SSH_USERNAME@$SSH_HOST:/home/$SSH_USERNAME/app/

      - name: Copy nginx folder to server
        run: |
          ssh $SSH_USERNAME@$SSH_HOST "mkdir -p /home/$SSH_USERNAME/app/nginx && sudo chown $SSH_USERNAME:$SSH_USERNAME /home/$SSH_USERNAME/app/nginx && sudo chmod ug+w /home/$SSH_USERNAME/app/nginx"
          rsync -az uat/nginx/ $SSH_USERNAME@$SSH_HOST:/home/$SSH_USERNAME/app/nginx/

      - name: Run Server
        run: |
          cd /home/$SSH_USERNAME/app
          export $(cat .env.be | xargs)
          echo "${{ secrets.CR_PAT }}" | docker login ghcr.io -u USERNAME --password-stdin
          docker-compose down
          docker-compose pull --quiet
          docker-compose up -d
          docker-compose exec django python manage.py migrate --noinput
          docker image prune -af
